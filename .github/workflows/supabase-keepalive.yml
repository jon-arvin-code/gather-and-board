name: Supabase Keep-Alive

on:
  schedule:
    # Runs every day at 03:00 UTC (11:00 AM Philippine time).
    # Supabase pauses free projects after 7 days with no database activity,
    # so a daily ping keeps a wide safety margin.
    - cron: '0 3 * * *'
  workflow_dispatch: {}
    # ^ lets you trigger this manually from the Actions tab to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/inventory?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP status: $STATUS"
          cat /tmp/response.txt
          if [ "$STATUS" -ge 400 ]; then
            echo "Ping failed with status $STATUS"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
